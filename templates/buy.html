<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ name }} - 购买</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;color:#1a1a2e}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:40px 20px;text-align:center}
.header h1{font-size:1.6em;margin-bottom:6px}
.header .price{font-size:2em;font-weight:bold;margin-top:8px}
.header .price span{font-size:0.6em;font-weight:400;opacity:0.8}
.container{max-width:460px;margin:0 auto;padding:20px}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.08);margin-bottom:16px}
.card h3{font-size:1.1em;margin-bottom:12px;color:#333}
.pay-tabs{display:flex;gap:8px;margin-bottom:16px}
.pay-tab{flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:10px;cursor:pointer;font-size:0.95em;font-weight:600;background:white;text-align:center;transition:all 0.2s}
.pay-tab.active{border-color:#1677ff;background:#e6f4ff}
.qr-area{text-align:center;padding:20px;background:#fafafa;border-radius:12px;margin-bottom:16px}
.qr-area img{width:180px;height:180px;border-radius:8px}
.qr-placeholder{padding:40px;color:#999;font-size:0.9em}
.account-info{background:#f0f5ff;border-radius:8px;padding:10px;margin:8px 0;font-size:0.9em;color:#666}
.account-info strong{color:#1677ff;font-size:1.1em}
.step{display:none}
.step.show{display:block}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1.05em;font-weight:600;cursor:pointer;color:white;margin-top:12px;transition:transform 0.15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{background:#ccc !important;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2)}
.btn-green{background:linear-gradient(135deg,#52c41a,#389e0d)}
.btn-blue{background:linear-gradient(135deg,#1677ff,#0958d9)}
.btn-orange{background:linear-gradient(135deg,#fa8c16,#d46b08)}
.success-box{background:linear-gradient(135deg,#f6ffed,#d9f7be);border:2px solid #95de64;border-radius:20px;padding:28px 20px;text-align:center;margin-bottom:16px}
.success-box .big-icon{font-size:3.5em}
.success-box h2{font-size:1.5em;color:#389e0d;margin:4px 0}
.success-box .sub{color:#666;font-size:0.9em;margin:4px 0 12px}
.success-box .code{background:white;border:2px dashed #52c41a;border-radius:12px;padding:14px;margin:0 auto;max-width:240px;font-size:2.4em;font-weight:bold;letter-spacing:10px;font-family:'Courier New',monospace}
.success-box .code-label{font-size:0.8em;color:#999;margin-top:6px}
.email-area{text-align:left;padding:0 4px}
.email-area label{font-size:0.95em;font-weight:600;display:block;margin-bottom:6px;color:#333}
.email-area input{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:10px;font-size:1em;outline:none;box-sizing:border-box;transition:border-color 0.2s}
.email-area input:focus{border-color:#1677ff}
.tx-input{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:10px;font-size:0.95em;outline:none;box-sizing:border-box}
.tx-input:focus{border-color:#1677ff}
.tx-hint{font-size:0.8em;color:#999;margin:6px 0 4px;line-height:1.5}
.result-box{display:none;margin-top:16px;padding:20px;background:#f6ffed;border:1px solid #b7eb8f;border-radius:16px;text-align:center}
.result-box.show{display:block}
.result-box .dl-btn{display:inline-block;padding:14px 36px;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;text-decoration:none;border-radius:10px;font-weight:700;font-size:1.05em;margin-top:12px}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.back-link{display:block;text-align:center;margin-top:20px;color:#999;font-size:0.85em;text-decoration:none}
.back-link:hover{color:#667eea}
.poll-status{text-align:center;padding:16px;color:#666;font-size:0.9em;line-height:1.8}
.poll-status .spinner{display:inline-block;width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#667eea;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:8px}
</style>
</head>
<body>
<div class="header">
  <div style="font-size:3em;margin-bottom:6px">{{ emoji }}</div>
  <h1>{{ name }}</h1>
  <div class="price">¥{{ price }} <span>即时交付</span></div>
</div>

<div class="container">
  <!-- 步骤1: 选择支付方式 -->
  <div class="step show" id="step1">
    <div class="card">
      <h3>选择支付方式</h3>
      <div class="pay-tabs">
        <div class="pay-tab active" id="tabAlipay" onclick="selPay('alipay')">💳 支付宝</div>
        <div class="pay-tab" id="tabWechat" onclick="selPay('wechat')">💚 微信</div>
      </div>
      <button class="btn btn-primary" id="payBtn" onclick="startPay()">💳 确认支付 - ¥{{ price }}</button>
    </div>
  </div>

  <!-- 步骤2: 扫码付款 -->
  <div class="step" id="step2">
    <div class="card">
      <h3>💳 扫码付款</h3>
      <div class="qr-area">
        <img id="qrImg" src="" style="display:none" alt="支付二维码">
        <div class="qr-placeholder" id="qrLoad">正在生成二维码...</div>
      </div>
      <div class="account-info" id="payAccountInfo">转账到：<strong id="payAccount">{{ alipay }}</strong></div>
      <div id="autoPollArea" style="display:none;">
        <!-- PayJS自动轮询 -->
        <div class="poll-status" id="pollStatus">
          <div class="spinner"></div>
          <div>等待付款...</div>
          <div style="font-size:0.85em;color:#999;">扫码后自动检测，无需手动操作</div>
        </div>
      </div>
      <div id="manualArea">
        <button class="btn btn-green" id="paidBtn" onclick="confirmPaid()">✅ 我已付款，输入交易号</button>
      </div>
    </div>
  </div>

  <!-- 步骤2b: 输入交易号验证（手动模式） -->
  <div class="step" id="stepTx">
    <div class="card">
      <h3>🔍 验证付款</h3>
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:2.5em;margin-bottom:4px;">🔎</div>
        <div style="font-size:1em;color:#333;font-weight:600;">请验证你的付款</div>
      </div>
      <div class="email-area">
        <label>请输入交易号</label>
        <div class="tx-hint">打开<span id="txPayName">支付宝</span> → 账单 → 找到这笔付款的交易号</div>
        <input type="text" id="txInput" class="tx-input" placeholder="输入交易号" maxlength="32">
        <button class="btn btn-orange" id="txBtn" onclick="verifyTx()">🔍 验证</button>
        <div style="margin-top:12px;text-align:center;">
          <button onclick="backToPay()" style="border:none;background:none;color:#999;font-size:0.85em;cursor:pointer;">← 重新付款</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 步骤3: 支付成功 + 校验码 + 邮箱 -->
  <div class="step" id="step3">
    <div class="success-box">
      <div class="big-icon">🎉</div>
      <h2>支付成功 支付成功！</h2>
      <div class="sub">验证通过，下载验证码自动生成</div>
      <div class="code" id="codeDisplay">----</div>
      <div class="code-label">付款校验码（请勿关闭此页）</div>
    </div>
    <div class="card">
      <div class="email-area">
        <label>📧 请输入下载邮箱</label>
        <input type="email" id="emailInput" placeholder="如 123@qq.com">
        <button class="btn btn-blue" id="dlBtn" onclick="doDownload()">📥 获取产品下载链接</button>
      </div>
      <div class="result-box" id="resultBox">
        <div id="resultContent"></div>
      </div>
    </div>
  </div>

  <a href="/" class="back-link">← 返回首页</a>
</div>

<script>
var pid = '{{ pid }}';
var payType = 'alipay';
var verifyCode = '';
var txId = '';
var orderId = '';
var isGatewayPay = false;
var pollTimer = null;

function selPay(t) {
  payType = t;
  document.getElementById('tabAlipay').className = 'pay-tab' + (t==='alipay' ? ' active' : '');
  document.getElementById('tabWechat').className = 'pay-tab' + (t==='wechat' ? ' active' : '');
}

function startPay() {
  var btn = document.getElementById('payBtn');
  btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 生成中...';
  fetch('/api/payment/qrcode', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({product_id:pid, payment:payType})
  }).then(r=>r.json()).then(d => {
    if (d.ok) {
      document.getElementById('qrImg').src = d.qr;
      document.getElementById('qrImg').style.display = 'block';
      document.getElementById('qrLoad').style.display = 'none';
      document.getElementById('payAccount').textContent = d.account;
      orderId = d.order_id;
      
      isGatewayPay = (d.gateway === 'payjs');
      document.getElementById('step1').classList.remove('show');
      document.getElementById('step2').classList.add('show');
      
      if (isGatewayPay) {
        // 支付网关模式：自动轮询检测付款
        document.getElementById('autoPollArea').style.display = 'block';
        document.getElementById('manualArea').style.display = 'none';
        startPolling(orderId);
      } else {
        // 手动模式：用户输入交易号
        document.getElementById('autoPollArea').style.display = 'none';
        document.getElementById('manualArea').style.display = 'block';
      }
    } else { alert('失败: '+d.msg); }
    btn.disabled=false; btn.innerHTML='💳 确认支付 - ¥{{ price }}';
  }).catch(()=>{alert('网络错误');btn.disabled=false;btn.innerHTML='💳 确认支付 - ¥{{ price }}';});
}

function startPolling(orderId) {
  var pollCount = 0;
  var maxPolls = 120; // 最多等5分钟
  
  function poll() {
    pollCount++;
    document.querySelector('#pollStatus div:last-child').textContent = 
      '等待付款... 已等待' + (pollCount * 2.5).toFixed(0) + '秒';
    
    fetch('/api/payment/check/' + orderId)
      .then(r=>r.json())
      .then(d => {
        if (d.ok && d.status === 'paid') {
          // 付款成功！
          clearInterval(pollTimer);
          callPayConfirm();
        } else if (pollCount >= maxPolls) {
          // 超时，切换到手动模式
          clearInterval(pollTimer);
          document.getElementById('autoPollArea').style.display = 'none';
          document.getElementById('manualArea').style.display = 'block';
          alert('支付超时，请手动输入交易号验证');
        }
      });
  }
  
  pollTimer = setInterval(poll, 2500);
  setTimeout(poll, 1000); // 1秒后首次检查
}

function callPayConfirm() {
  fetch('/api/order/pay-confirm', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({product_id:pid, payment:payType})
  }).then(r=>r.json()).then(d => {
    if (d.ok) {
      verifyCode = d.verify_code;
      document.getElementById('codeDisplay').textContent = verifyCode;
      document.getElementById('step2').classList.remove('show');
      document.getElementById('step3').classList.add('show');
      document.getElementById('step3').scrollIntoView({behavior:'smooth',block:'center'});
      document.getElementById('emailInput').focus();
    }
  });
}

function confirmPaid() {
  document.getElementById('step2').classList.remove('show');
  document.getElementById('stepTx').classList.add('show');
  document.getElementById('txPayName').textContent = payType === 'alipay' ? '支付宝' : '微信';
  document.getElementById('txInput').value = '';
  document.getElementById('txInput').focus();
}

function backToPay() {
  document.getElementById('stepTx').classList.remove('show');
  document.getElementById('step2').classList.add('show');
}

function verifyTx() {
  txId = document.getElementById('txInput').value.trim();
  if (!txId || txId.length < 6) { alert('请输入交易号'); return; }
  
  var btn = document.getElementById('txBtn');
  btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 验证中...';
  
  fetch('/api/order/pay-confirm', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({product_id:pid, payment:payType})
  }).then(r=>r.json()).then(d => {
    if (d.ok) {
      verifyCode = d.verify_code;
      document.getElementById('codeDisplay').textContent = verifyCode;
      document.getElementById('stepTx').classList.remove('show');
      document.getElementById('step3').classList.add('show');
      document.getElementById('step3').scrollIntoView({behavior:'smooth',block:'center'});
      document.getElementById('emailInput').focus();
    } else {
      alert('验证失败: '+(d.msg||'请重试'));
      btn.disabled=false; btn.innerHTML='🔍 验证';
    }
  }).catch(()=>{alert('网络错误');btn.disabled=false;btn.innerHTML='🔍 验证';});
}

function doDownload() {
  var email = document.getElementById('emailInput').value.trim();
  if (!email||!email.includes('@')) { alert('请输入正确的邮箱'); return; }
  
  var btn = document.getElementById('dlBtn');
  btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 发送中...';
  
  fetch('/api/order', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      product_id:pid, email:email,
      payment:payType==='alipay'?'支付宝':'微信',
      verify_code:verifyCode,
      tx_id: txId
    })
  }).then(r=>r.json()).then(d => {
    if (d.ok) {
      document.getElementById('resultBox').classList.add('show');
      document.getElementById('resultContent').innerHTML = `
        <div style="font-size:2em;margin-bottom:8px;">🎉</div>
        <div style="font-weight:700;font-size:1.1em;margin-bottom:8px">${d.product_name}</div>
        <div style="font-size:0.9em;color:#666;margin-bottom:4px">激活码：</div>
        <div style="background:#1a1a2e;color:#ffd700;padding:10px;border-radius:8px;font-size:1.1em;font-weight:bold;font-family:monospace;margin-bottom:12px">${d.delivery_code}</div>
        <a href="${d.download_url}" target="_blank" class="dl-btn">📥 立即下载</a>
        <div style="margin-top:10px;font-size:0.85em;color:#52c41a">✅ 已发送到邮箱：${email}</div>
      `;
      btn.style.display = 'none';
      document.getElementById('emailInput').disabled = true;
    } else {
      alert('失败: '+(d.msg||'校验码无效'));
      btn.disabled=false; btn.innerHTML='📥 获取产品下载链接';
    }
  }).catch(()=>{alert('网络错误');btn.disabled=false;btn.innerHTML='📥 获取产品下载链接';});
}

document.getElementById('emailInput').addEventListener('keydown', function(e){if(e.key==='Enter')doDownload()});
document.getElementById('txInput').addEventListener('keydown', function(e){if(e.key==='Enter')verifyTx()});
</script>
</body>
</html>
