<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - AutoTools</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: linear-gradient(135deg, #667eea, #764ba2);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; border-radius: 20px; padding: 40px;
                     box-shadow: 0 20px 60px rgba(0,0,0,0.15);
                     width: 360px; max-width: 90%; text-align: center; }
        .login-box h1 { font-size: 1.8em; margin-bottom: 8px; color: #1a1a2e; }
        .login-box p { color: #666; margin-bottom: 24px; font-size: 0.95em; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 16px;
                          border: 2px solid #ddd; border-radius: 10px;
                          font-size: 1em; text-align: center; }
        .login-box input:focus { border-color: #667eea; outline: none; }
        .login-box button { width: 100%; padding: 14px; border: none; border-radius: 10px;
                           font-size: 1.1em; font-weight: 600;
                           background: linear-gradient(135deg, #667eea, #764ba2);
                           color: white; cursor: pointer; }
        .login-box button:hover { opacity: 0.9; }
        .error { color: #e74c3c; font-size: 0.9em; margin-bottom: 16px; }
        .back-link { display: block; margin-top: 16px; color: #999; font-size: 0.85em;
                     text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 管理员登录</h1>
        <p>请输入管理密码</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="请输入管理密码" required autofocus>
            <button type="submit">登录</button>
        </form>
        <a href="/" class="back-link">← 返回首页</a>
    </div>
</body>
</html>
